[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sonos-mcp-server"
version = "0.1.0"
description = "MCP server for Sonos speaker control and management"
authors = [
    {name = "Winston Fassett", email = "your.email@example.com"},
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.5.0",
    "soco>=0.30.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
sonos-mcp-server = "sonos_mcp_server.server:main"

[project.entry-points."mcp.servers"]
sonos = "sonos_mcp_server.server:mcp"

[project.urls]
Homepage = "https://github.com/WinstonFassett/sonos-mcp-server"
Repository = "https://github.com/WinstonFassett/sonos-mcp-server"
Issues = "https://github.com/WinstonFassett/sonos-mcp-server/issues"

[tool.black]
line-length = 88
target-version = ['py312']

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true